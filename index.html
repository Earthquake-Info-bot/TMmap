let miniVisible = true;

document.getElementById('maxAlertBox').addEventListener('click', () => {
  miniVisible = !miniVisible;

  const display = miniVisible ? 'block' : 'none';

  document.getElementById('okinawaWrapper').style.display = display;
  document.getElementById('ogasawaraWrapper').style.display = display;
  document.getElementById('hypo-cross').style.display = display;
  document.getElementById('mapCredit').style.display = display;
});

document.getElementById('mapCredit').addEventListener('click', () => {
  forecastVisible = !forecastVisible;

  if(forecastVisible){
    forecastLayerGroup.addTo(map);
    forecastLayerGroupOkinawa.addTo(miniMapOkinawa);
    forecastLayerGroupOgasawara.addTo(miniMapOgasawara);
  } else {
    map.removeLayer(forecastLayerGroup);
    miniMapOkinawa.removeLayer(forecastLayerGroupOkinawa);
    miniMapOgasawara.removeLayer(forecastLayerGroupOgasawara);
  }
});
</script>

  map.createPane('land');

  const prefGeoJson = await res.json();

  L.geoJSON(prefGeoJson, {
    pane: 'land',
    style: {
      color: '#999',
      weight: 1,
      fillColor: '#eeeeee',
      fillOpacity: 1
    }
  }).addTo(map);
}

  mapInstance.createPane('land');
  mapInstance.getPane('land').style.zIndex = 200;

  fetch('./prefectures.geojson')
    .then(r => r.json())
    .then(prefGeoJson => {
      L.geoJSON(prefGeoJson, {
        pane: 'land',
        style: {
          color: '#999',
          weight: 1,
          fillColor: '#eeeeee',

      maxAlertBox.textContent = `${text}`;

      // 背景色
      maxAlertBox.style.background = tsunamiColors[maxKindCode] || 'gray';

      // 文字色 + アウトライン
      if(['51','52','53'].includes(maxKindCode)){
        maxAlertBox.style.color = 'white';
        //maxAlertBox.style.webkitTextStroke = '2px black';
      } else {
        maxAlertBox.style.color = 'black';
        //maxAlertBox.style.webkitTextStroke = '2px white';
      }

    } else {
      maxAlertBox.textContent = '沖合の津波観測に関する情報';
      maxAlertBox.style.background = 'gray';
      maxAlertBox.style.color = 'white';
    }

    await updateStatus('すべての津波ポリゴン描画完了');
    setTimeout(()=>{statusBox.classList.add('hidden');},1000);

  } catch(e){
    await updateStatus('エラー: '+e.message);
  }
}

// 津波コード → pane の対応
function getTsunamiPane(kindCode){
  if(kindCode === '52' || kindCode === '53') return 'tsunami-purple'; // 大津波・津波警報
  if(kindCode === '51') return 'tsunami-red';    // 津波警報
  if(kindCode === '62') return 'tsunami-yellow'; // 津波注意報
  if(['71','72','73'].includes(kindCode)) return 'tsunami-blue'; // 予報・解除等
  return undefined;
}

loadXML();
</script>
